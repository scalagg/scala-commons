plugins {
    id "java"
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.28.2"
    id "com.github.johnrengelman.shadow" version "7.1.2"
    id "org.jetbrains.kotlin.jvm" version "1.6.21"
    id "org.jetbrains.kotlin.kapt" version "1.6.21"
}

allprojects {
    group "net.evilblock.cubed"
    version "1.3.7"

    repositories {
        mavenCentral()

        maven {
            url "https://jitpack.io"
        }

        maven {
            url "https://oss.sonatype.org/content/repositories/snapshots"
        }

        maven {
            url "${artifactory_contextUrl}/gradle-release"
            credentials {
                username "${artifactory_user}"
                password "${artifactory_password}"
            }
        }
    }
}

subprojects {
    apply plugin: "java"
    apply plugin: "maven-publish"

    apply plugin: "com.github.johnrengelman.shadow"

    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"

    apply plugin: "com.jfrog.artifactory"

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "1.8"
    }

    compileJava {
        options.compilerArgs += ["-parameters"]
        options.fork = true
        options.forkOptions.executable = "javac"
    }

    shadowJar {
        archiveClassifier.set("")

        exclude "**/*.kotlin_metadata"
        exclude "**/*.kotlin_module"
        exclude "**/*.kotlin_builtins"

        exclude "META-INF/"

        archiveFileName = "cubed-${project.name}.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                from components.kotlin
            }
        }

        repositories {
            maven {
                name "scala"
                url "${artifactory_contextUrl}/${artifactory_release}"
                credentials {
                    username "${artifactory_user}"
                    password "${artifactory_password}"
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar,
        publishShadowPublicationToScalaRepository
    )
}

artifactory {
    this.contextUrl = "${artifactory_contextUrl}"

    publish {
        repository {
            repoKey = "${artifactory_release_local}"
            username = "${artifactory_user}"
            password = "${artifactory_password}"
            maven = true
        }
    }
}

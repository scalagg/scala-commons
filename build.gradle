plugins {
    id "java"
    id "maven-publish"
    id "com.jfrog.artifactory" version "4.29.2"
    id "io.github.goooler.shadow" version "8.1.8"
    id "org.jetbrains.kotlin.jvm" version "2.0.0"
    id "org.jetbrains.kotlin.kapt" version "2.0.0"
}

allprojects {
    group "gg.scala.commons"
    version "4.1.0"

    repositories {
        mavenCentral()

        maven { url "https://jitpack.io" }
        maven { url "https://repo.aikar.co/nexus/content/repositories/aikar/" }
        maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    }
}

subprojects {
    apply plugin: "com.jfrog.artifactory"

    apply plugin: "java"
    apply plugin: "maven-publish"

    apply plugin: "io.github.goooler.shadow"

    apply plugin: "org.jetbrains.kotlin.jvm"
    apply plugin: "org.jetbrains.kotlin.kapt"

    repositories {
        maven {
            url "${property("artifactory_contextUrl")}/gradle-release"

            credentials {
                setUsername(
                    property("artifactory_user")
                )
                setPassword(
                    property("artifactory_password")
                )
            }
        }
    }

    compileKotlin {
        kotlinOptions.javaParameters = true
        kotlinOptions.jvmTarget = "21"
    }

    compileJava {
        options.compilerArgs += ["-parameters"]
        options.fork = true
        sourceCompatibility = "21"
        targetCompatibility = "21"
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    shadowJar {
        archiveClassifier.set("")

        archiveFileName = "sccommons-${project.name}.jar"
    }

    publishing {
        publications {
            shadow(MavenPublication) { publication ->
                project.shadow.component(publication)
            }
        }

        repositories {
            mavenLocal()
            maven {
                name "Scala"
                url "${property("artifactory_contextUrl")}/gradle-release"

                credentials {
                    username property("artifactory_user")
                    password property("artifactory_password")
                }
            }
        }
    }

    tasks.build.dependsOn(
        shadowJar
    )
}

artifactory {
    this.contextUrl = property("artifactory_contextUrl")

    publish {
        repository {
            repoKey = property("artifactory_release_local")
            username = property("artifactory_user")
            password = property("artifactory_password")
            maven = true
        }
    }
}

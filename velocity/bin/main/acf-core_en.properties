acf-core.permission_denied=&cYou do not have permission to perform this command!
acf-core.permission_denied_parameter=&cYou do not have permission to perform this subcommand!
acf-core.error_generic_logged=&cAn error occurred, this problem has been logged. Sorry for the inconvenience.
acf-core.unknown_command=&cThe specified command does not exist.
acf-core.invalid_syntax=<c2>&lUsage:</c2> <c1>{command}</c1> <c4>{syntax}</c4>
acf-core.error_prefix=&c{message}
acf-core.error_performing_command=&cAn error occurred, this problem has been logged. Sorry for the inconvenience.
acf-core.info_message={message}
acf-core.please_specify_one_of=&cPlease specify one of the following: <c2>{valid}</c2>.
acf-core.must_be_a_number=<c2>{num}<c1> must be a number.
acf-core.must_be_min_length=<c1>Must be at least <c2>{min}</c2> characters long.
acf-core.must_be_max_length=<c1>Must be at most <c2>{max}</c2> characters long.
acf-core.please_specify_at_most=<c1>Please specify a value at most <c2>{max}</c2>.
acf-core.please_specify_at_least=<c1>Please specify a value at least <c2>{min}</c2>.
acf-core.not_allowed_on_console=<c1>Console may not execute this command.
acf-core.could_not_find_player=<c1>No player matching <c2>{search}</c2> could be found.
acf-core.no_command_matched_search=<c1>No command matched <c2>{search}</c2>.
acf-core.help_page_information=<c2>Showing page</c2> <c1>{page}</c1> <c2>of</c2> <c1>{totalpages}</c1> <c3>({results} results)</c3><c2>.</c2>
acf-core.help_no_results=&cCould not find more results.
acf-core.help_header=<c1>===</c1> <c2>Showing help for</c2> <c4>{commandprefix}{command}</c4> <c1>===</c1>
acf-core.help_format=<c2>/{command}</c2> <c1>{parameters}</c1> <c3>{separator} {description}</c3>
acf-core.help_detailed_header=<c1>===</c1> <c2>Showing detailed help for</c2> <c4>{commandprefix}{command}</c4> <c1>===</c1>
acf-core.help_detailed_command_format=<c2>{command}</c2> <c1>{parameters}</c1> <c3>{separator} {description}</c3>
acf-core.help_detailed_parameter_format=<c1>{syntaxorname}:</c1> <c2>{description}</c2>
acf-core.help_search_header=<c1>===</c1> <c2>Search results for</c2> <c4>{commandprefix}{command}</c4> <c3>{search}</c3> <c1>===</c1>

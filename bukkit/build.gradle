repositories {
    maven { url "https://repo.aikar.co/content/groups/aikar/" }
    maven { url "https://maven.enginehub.org/repo/" }
    maven { url "https://repo.dmulloy2.net/nexus/repository/public" }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }

    maven { url "https://repo.viaversion.com" }
    maven { url "https://jitpack.io" }

    maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
    maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots/" }
}

dependencies {
    implementation project(":serializers")
    implementation project(":store")
    implementation project(":commons")
    implementation project(":serversync")

    implementation project(":core")

    compileOnly "me.lucko:spark-api:0.1-SNAPSHOT"

    // todo: only api on standalone?
    compileOnly "org.jetbrains.kotlin:kotlin-reflect"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib"

    implementation "org.yaml:snakeyaml:1.32"

    implementation "org.jetbrains.kotlin:kotlin-script-runtime"
    implementation "org.jetbrains.kotlin:kotlin-main-kts"
    implementation "org.jetbrains.kotlin:kotlin-scripting-jsr223"

    compileOnly fileTree(dir: "lib", include: "*.jar")
    implementation fileTree("wrapper")

    api "gg.scala.tab:shared:1.1.2-20230403.000608-9"
    api "gg.scala.tab:v1_8_R3:1.1.2-20230405.180045-11"

    // helper
    implementation "me.lucko:helper:5.6.13"
    kapt "me.lucko:helper:5.6.10.2"

    // sentry
    compileOnly "io.sentry:sentry:6.5.0"

    // growly
    implementation "gg.scala.aware:aware:1.1.9"
    implementation "gg.scala.flavor:flavor:0.1.6"

    implementation "dev.cubxity.plugins:unifiedmetrics-platform-bukkit:0.3.9-SNAPSHOT"
    implementation "org.scala-lang:scala-library:2.13.10"

    compileOnly "me.lucko:scriptcontroller:1.2"
    compileOnly "io.github.classgraph:classgraph:4.8.149"

    compileOnly "com.github.MilkBowl:VaultAPI:1.7.1"
    compileOnly "com.comphenix.protocol:ProtocolLib:5.0.0"

    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "org.apache.commons:commons-pool2:2.11.1"

    implementation "org.reflections:reflections:0.10.2"
    implementation "io.reactivex.rxjava3:rxjava:3.1.5"

    // adventure
    implementation "net.kyori:adventure-api:4.11.0"
    implementation "net.kyori:adventure-platform-bukkit:4.1.2"

    implementation "net.kyori:adventure-text-serializer-gson:4.11.0"
    implementation "net.kyori:adventure-text-minimessage:4.11.0"

    compileOnly "dev.cubxity.plugins:unifiedmetrics-api:0.3.6"

    // google
    compileOnly "com.google.zxing:core:3.5.0"
    implementation "com.google.code.gson:gson:2.10.1"

    // other
    implementation "com.github.cryptomorin:XSeries:9.1.0"
    implementation "com.github.ben-manes.caffeine:caffeine:3.1.1"

    compileOnly "com.viaversion:viaversion-api:4.4.2"

    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    implementation "org.mongodb:mongodb-driver:3.12.11"
    implementation "com.github.mkotb:ConfigAPI:e1c8df3f13"

    // scala
    compileOnly "gg.scala.spigot:server:1.1.2"
    compileOnly "gg.scala.store:spigot:0.1.9"

    // reflekt
    implementation "com.github.GrowlyX:reflektion:a33bf04483"

    // redis
    implementation "io.lettuce:lettuce-core:6.2.3.RELEASE.MOD"

    testImplementation "org.jetbrains.kotlin:kotlin-test"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.9.1"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.1"
}

test {
    useJUnitPlatform()
}

shadowJar {
    relocate "co.aikar.commands", "gg.scala.commons.acf"
    relocate "co.aikar.locales", "gg.scala.commons.locales"

    relocate "org.reflections", "gg.scala.commons.reflections"

    exclude "**/kotlin/**"
}

repositories {
    maven { url "https://maven.enginehub.org/repo/" }
    maven { url "https://repo.aikar.co/content/groups/aikar/" }
    maven { url "https://repo.dmulloy2.net/nexus/repository/public" }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }

    maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
}

dependencies {
    implementation project(":serializers")
    implementation project(":store")

    compileOnly fileTree(dir: "lib", include: "*.jar")

    // helper
    implementation "me.lucko:helper:5.6.10.1"
    kapt "me.lucko:helper:5.6.10.1"

    // sentry
    implementation "io.sentry:sentry:6.0.0"

    // growly
    implementation "gg.scala.aware:aware:1.0.8.2"
    implementation "gg.scala.flavor:flavor:0.1.3.7"

    implementation "me.lucko:scriptcontroller:1.2"
    implementation "io.github.classgraph:classgraph:4.8.147"

    compileOnly "com.github.MilkBowl:VaultAPI:1.7"
    compileOnly "com.comphenix.protocol:ProtocolLib:4.8.0"

    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "org.reflections:reflections:0.10.2"

    // adventure
    compileOnly "net.kyori:adventure-api:4.11.0"
    compileOnly "net.kyori:adventure-platform-bukkit:4.1.1"
    implementation "net.kyori:adventure-text-serializer-gson:4.11.0"

    implementation "net.kyori:adventure-text-minimessage:4.11.0"

    // square up
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp:okhttp:2.7.5"

    // google
    implementation "com.google.zxing:core:3.5.0"
    implementation "com.google.code.gson:gson:2.9.0"

    // other
    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    implementation "com.github.cryptomorin:XSeries:8.8.0"
    implementation "org.mongodb:mongodb-driver:3.12.11"
    implementation "com.github.mkotb:ConfigAPI:e1c8df3f13"
    implementation "com.github.ben-manes.caffeine:caffeine:3.1.0"

    // scala
    compileOnly "gg.scala.spigot:sspigot-server:1.0.7"
    compileOnly "gg.scala.store:spigot:0.1.3"

    // reflekt
    compileOnly "com.github.GrowlyX:reflektion:a33bf04483"

    // lettuce
    implementation "io.lettuce:lettuce-core:6.3.0.STABLE"
}

shadowJar {
    relocate "co.aikar.commands", "gg.scala.commons.acf"
    relocate "co.aikar.locales", "gg.scala.commons.locales"

    relocate "org.reflections", "gg.scala.commons.reflections"

    exclude "**/kotlin/**"
    exclude "**/META-INF/**"
}

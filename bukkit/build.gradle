repositories {
    maven { url "https://maven.enginehub.org/repo/" }
    maven { url "https://repo.aikar.co/content/groups/aikar/" }
    maven { url "https://repo.dmulloy2.net/nexus/repository/public" }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }

    maven { url "https://repo.viaversion.com" }
    maven { url "https://jitpack.io" }

    maven { url "https://repo.viaversion.com/" }

    maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
}

dependencies {
    implementation project(":serializers")
    implementation project(":store")
    implementation project(":commons")

    compileOnly "org.jetbrains.kotlin:kotlin-reflect"

    implementation "org.jetbrains.kotlin:kotlin-script-runtime"
    implementation "org.jetbrains.kotlin:kotlin-script-util"

    compileOnly fileTree(dir: "lib", include: "*.jar")

    // helper
    implementation "me.lucko:helper:5.6.10.2"
    kapt "me.lucko:helper:5.6.10.2"

    // sentry
    compileOnly "io.sentry:sentry:6.3.0"

    // growly
    implementation "gg.scala.aware:aware:1.0.8.3"
    implementation "gg.scala.flavor:flavor:0.1.3.8"

    // hoplite
    implementation "com.sksamuel.hoplite:hoplite-core:2.5.1"
    implementation "com.sksamuel.hoplite:hoplite-yaml:2.5.1"
    implementation "com.sksamuel.hoplite:hoplite-toml:2.5.1"
    implementation "com.sksamuel.hoplite:hoplite-hocon:2.5.1"
    implementation "com.sksamuel.hoplite:hoplite-json:2.5.1"

    compileOnly "me.lucko:scriptcontroller:1.2"
    compileOnly "io.github.classgraph:classgraph:4.8.149"

    compileOnly "com.github.MilkBowl:VaultAPI:1.7"
    compileOnly "com.comphenix.protocol:ProtocolLib:4.8.0"

    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "org.reflections:reflections:0.10.2"

    implementation "io.reactivex.rxjava3:rxjava:3.1.5"

    // adventure
    compileOnly "net.kyori:adventure-api:4.11.0"
    compileOnly "net.kyori:adventure-platform-bukkit:4.1.1"

    compileOnly "net.kyori:adventure-text-serializer-gson:4.11.0"
    compileOnly "net.kyori:adventure-text-minimessage:4.11.0"

    // square up
    compileOnly "com.squareup.retrofit2:retrofit:2.9.0"
    compileOnly "com.squareup.retrofit2:converter-gson:2.9.0"
    compileOnly "com.squareup.okhttp:okhttp:2.7.5"

    // google
    compileOnly "com.google.zxing:core:3.5.0"
    implementation "com.google.code.gson:gson:2.9.0"

    // other
    implementation "com.github.cryptomorin:XSeries:9.0.0"
    implementation "com.github.ben-manes.caffeine:caffeine:3.1.1"

    compileOnly "com.viaversion:viaversion-api:4.3.1"

    compileOnly "com.github.NoSequel.TabAPI:shared:c51f5f5b3f"
    compileOnly "com.github.NoSequel.TabAPI:v1_8_R3:c51f5f5b3f"

    compileOnly "com.viaversion:viaversion-api:4.4.1"

    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    implementation "org.mongodb:mongodb-driver:3.12.11"
    implementation "com.github.mkotb:ConfigAPI:e1c8df3f13"

    // scala
    compileOnly "gg.scala.spigot:server:1.1.0"
    compileOnly "gg.scala.store:spigot:0.1.3"

    compileOnly "io.lettuce:lettuce-core:6.1.8.RELEASE"

    // reflekt
    implementation "com.github.GrowlyX:reflektion:a33bf04483"

    // lettuce
    implementation "io.lettuce:lettuce-core:6.2.2.STABLE"
}

shadowJar {
    relocate "co.aikar.commands", "gg.scala.commons.acf"
    relocate "co.aikar.locales", "gg.scala.commons.locales"

    relocate "org.reflections", "gg.scala.commons.reflections"

    exclude "**/kotlin/**"
    exclude "**/META-INF/**"
}

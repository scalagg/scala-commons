repositories {
    maven { url "https://maven.enginehub.org/repo/" }
    maven { url "https://repo.aikar.co/content/groups/aikar/" }
    maven { url "https://repo.dmulloy2.net/nexus/repository/public" }
    maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }

    maven { url "https://oss.sonatype.org/content/repositories/snapshots" }
    maven { url "https://oss.sonatype.org/content/repositories/central" }

    maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
}

dependencies {
    implementation project(":serializers")
    implementation project(":store")

    compileOnly fileTree(dir: "lib", include: "*.jar")

    // helper
    compileOnly "me.lucko:helper:5.6.9.1"
    kapt "me.lucko:helper:5.6.9.1"

    compileOnly "com.github.MilkBowl:VaultAPI:1.7"
    compileOnly "com.comphenix.protocol:ProtocolLib:4.8.0"

    implementation "org.apache.commons:commons-lang3:3.12.0"
    implementation "org.reflections:reflections:0.10.2"

    // adventure
    compileOnly "net.kyori:adventure-api:4.10.1"
    compileOnly "net.kyori:adventure-platform-bukkit:4.1.0"

    // square up
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp:okhttp:2.7.5"

    // google
    implementation "com.google.zxing:core:3.4.1"
    implementation "com.google.code.gson:gson:2.9.0"

    // other
    implementation "co.aikar:acf-paper:0.5.1-SNAPSHOT"
    implementation "com.github.cryptomorin:XSeries:8.7.1"
    implementation "org.mongodb:mongodb-driver:3.12.10"
    implementation "com.github.ben-manes.caffeine:caffeine:3.0.6"

    // scala
//    compileOnly "org.spigotmc:spigot:1.18.2-R0.1-SNAPSHOT"

    compileOnly "gg.scala.spigot:sspigot-server:1.0.7"
    compileOnly "gg.scala.store:spigot:0.1.3"

    implementation "gg.scala.aware:aware:1.0.7"
    implementation "gg.scala.flavor:flavor:0.1.3.5"

    // lettuce
    compileOnly "io.lettuce:lettuce-core:6.1.8.RELEASE"
}

shadowJar {
    relocate "co.aikar.commands", "net.evilblock.cubed.acf"
    relocate "co.aikar.locales", "net.evilblock.cubed.locales"

    relocate "org.reflections", "net.evilblock.cubed.reflections"

    exclude "**/kotlin/**"
}

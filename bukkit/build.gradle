import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
    ext.kotlin_version = '1.3.61'
}

plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '1.6.0'
    id 'com.github.johnrengelman.shadow' version '5.2.0'
}

repositories {
    mavenLocal()
    mavenCentral()

    maven { url = 'https://jitpack.io' }
    maven { url = 'https://repo.lucko.me' }
    maven { url = 'https://maven.enginehub.org/repo/' }
    maven { url = "https://repo.aikar.co/content/groups/aikar/" }
    maven { url = 'https://repo.dmulloy2.net/nexus/repository/public' }
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
}

dependencies {
    implementation project(':serializers')
    implementation project(':store')
    implementation project(':banana')

    compileOnly fileTree(dir: 'lib', include: '/impl/*.jar')
    implementation fileTree(dir: 'lib', include: '*.jar')

    compileOnly "me.lucko:helper:5.6.8"
    compileOnly 'com.google.code.gson:gson:2.8.9'
    compileOnly 'com.github.MilkBowl:VaultAPI:1.7'
    compileOnly 'com.sk89q.worldedit:worldedit-bukkit:6.1.4-SNAPSHOT'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.6.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp:okhttp:2.7.5'

    implementation 'com.google.zxing:core:3.4.1'
    implementation 'com.github.azbh111:ProtocolLib:4.4.0'
    implementation 'co.aikar:acf-paper:0.5.0-SNAPSHOT'
    implementation 'com.github.cryptomorin:XSeries:8.5.0.1'
    implementation 'org.mongodb:mongodb-driver:3.12.10'
}

compileJava {
    options.compilerArgs += ["-parameters"]
    options.fork = true
    options.forkOptions.executable = 'javac'
}

compileKotlin {
    kotlinOptions.javaParameters = true
    kotlinOptions.jvmTarget = "1.8"
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

shadowJar {
    classifier = 'all'

    exclude '**/*.kotlin_metadata'
    exclude '**/*.kotlin_module'
    exclude '**/*.kotlin_builtins'

    relocate 'co.aikar.commands', 'net.evilblock.cubed.acf'
    relocate 'co.aikar.locales', 'net.evilblock.cubed.locales'

    archiveFileName = "cubed-${project.name}-${project.version}.jar"
}

publishing {
    publications {
        shadow(MavenPublication) { publication ->
            project.shadow.component(publication)
        }
    }
}

processResources {
    filter ReplaceTokens, tokens: ["VERSION": System.getenv("GIT_COMMIT_ID_ABBREV").toString()]
}

repositories {
    maven { url "https://repo.dmulloy2.net/nexus/repository/public" }
    maven { url "https://jitpack.io" }
}

dependencies {
    compileOnly files("../bukkit/build/libs/bukkit-${rootProject.version}.jar")
    compileOnly "gg.scala.spigot:sspigot-server:1.0.8"
    compileOnly files("${System.properties['user.home']}/.gradle/caches/modules-2/files-2.1/com.github.retrooper/packetevents-spigot/2.11.2/69fbb3310cca52004d4b9a5af607cd80f379f7bc/packetevents-spigot-2.11.2.jar")
    compileOnly files("${System.properties['user.home']}/.gradle/caches/modules-2/files-2.1/com.github.retrooper/packetevents-api/2.11.2/acb60a83fa6eb26746fabc7efe58fcfafe27eec5/packetevents-api-2.11.2.jar")
    compileOnly "io.netty:netty-buffer:4.1.115.Final"

    compileOnly "me.lucko:helper:5.6.10.2"
}

tasks.matching { it.name == "kaptGenerateStubsKotlin" || it.name == "kaptKotlin" || it.name == "compileKotlin" || it.name == "compileJava" }.configureEach {
    dependsOn(":bukkit:jar")
}

name: CI

on:
  push:
    branches:
      - "*"

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:      
      - name: Push via Gitracker
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        uses: snowypy/Gitracker@master
